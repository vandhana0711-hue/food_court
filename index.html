<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Court - Dine In</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="header">
    <div class="logo">
        <img src="images/logo.jpeg" alt="Food Court">
        <h2>Food <span>Court</span></h2>
    </div>
    <div id="tableInfo">
    <label for="tableSelect">Select Your Table:</label>

    <select id="tableSelect">
        <option value="">Choose Table Number</option>
    </select>
</div>
</header>

<section class="hero">
    <p>WELCOME TO FOOD COURT</p>
    <h1>Delicious Food,<br><span>Happy Moments!</span></h1>
    <p>Order your favourite food directly from your table.</p>
    <a href="#menu">Explore Menu</a>
</section>

<section class="search-section">
    <input id="searchInput" type="text"
           placeholder="Search your favourite food...">
</section>

<section class="categories" id="menu">
    <h2>Explore Our Menu</h2>
    <div id="categories"></div>

    <div class="food-filters">
        <button data-type="All">All</button>
        <button data-type="Veg">Veg</button>
        <button data-type="Non-Veg">Non-Veg</button>
    </div>
</section>

<section class="food-section">
    <h2>Our Delicious Food</h2>
    <div id="foodContainer">
        Loading menu...
    </div>
</section>

<button id="cartButton" class="cart-button">
    🛒 Cart (<span id="cartCount">0</span>)
</button>

<section class="order-status">
    <h2>Track Your Order</h2>
    <input id="trackId" placeholder="Enter order number">
    <button id="trackBtn">Track Order</button>
    <div id="trackingResult"></div>
</section>

<footer class="footer">
    <h2>Food Court</h2>
    <p>Good Food. Great Mood.</p>
    <a href="/admin">Admin Login</a>
</footer>

<script src="js/script.js"></script>
</body>
</html>
