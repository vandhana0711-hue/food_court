<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Court - Admin Dashboard</title>
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>

    <header class="admin-header">
        <h2>Food Court - Admin</h2>
        <a href="/">View Customer Website</a>
    </header>

    <!-- Admin Login -->
    <section id="loginSection" class="login-box">
        <h2>Admin Login</h2>

        <input type="text" id="adminUsername"
               placeholder="Enter username">

        <input type="password" id="adminPassword"
               placeholder="Enter password">

        <button id="loginButton">Login</button>

        <p id="loginMessage"></p>
    </section>

    <!-- Admin Dashboard -->
    <main id="dashboardSection" style="display:none;">

        <h1>Admin Dashboard</h1>

        <button id="logoutButton">Logout</button>

        <section class="admin-card">
            <h2>Add / Edit Food Item</h2>

            <form id="foodForm">

                <input type="hidden" id="foodId">

                <input type="text" id="foodName"
                       placeholder="Food name" required>

                <select id="foodCategory" required>
                    <option value="">Select Category</option>
                    <option>Biryanis</option>
                    <option>Fried Rice</option>
                    <option>Curries</option>
                    <option>Starters</option>
                    <option>Tiffins</option>
                    <option>North Indian</option>
                    <option>Drinks</option>
                    <option>Desserts</option>
                </select>

                <select id="foodType" required>
                    <option value="">Select Food Type</option>
                    <option value="Veg">Veg</option>
                    <option value="Non-Veg">Non-Veg</option>
                </select>

                <textarea id="foodDescription"
                          placeholder="Food description"></textarea>

                <input type="number" id="foodPrice"
                       placeholder="Price" min="1" required>

                <input type="number" id="foodPrepTime"
                       placeholder="Preparation time in minutes"
                       min="1" required>

                <input type="text" id="foodImage"
                       placeholder="Image path or URL">

                <button type="submit" id="saveFoodButton">
                    Add Food Item
                </button>

                <button type="button" id="cancelEditButton">
                    Clear Form
                </button>

            </form>
        </section>

        <section class="admin-card">
            <h2>Manage Food Items</h2>
            <div id="adminFoodList">Loading food items...</div>
        </section>

        <section class="admin-card">
    <h2>Create Kitchen Team Account</h2>

    <form id="kitchenUserForm">
        <input type="text" id="newKitchenUsername"
               placeholder="Kitchen username" required minlength="3">

        <input type="password" id="newKitchenPassword"
               placeholder="Kitchen password (minimum 8 characters)"
               required minlength="8">

        <button type="submit">Create Kitchen Account</button>
    </form>

    <p id="kitchenUserMessage"></p>
    <a href="/kitchen.html">Open Kitchen Team Login</a>
</section>
        <section class="admin-card">
            <h2>Customer Orders</h2>
            <div id="adminOrderList">Loading orders...</div>
        </section>

    </main>

    <script src="js/admin.js"></script>

</body>
</html>
